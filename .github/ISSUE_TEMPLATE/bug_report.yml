name: Bug report / 问题反馈
description: 提供脱敏复现信息；不要上传账号文件或私人数据。
body:
  - type: textarea
    id: environment
    attributes:
      label: 版本与环境
      description: GPTPET 提交/版本、Windows、Node、Codex 版本，以及是否开启壁纸。
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: 复现步骤、实际结果和预期结果
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: 脱敏日志或截图（可选）
      description: 不要上传 installation.json、auth.json、聊天正文、完整用户目录或私人壁纸。
